<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小满屉 · Full Drawer</title>
<link rel="stylesheet" href="style.css?v=20261115c">
</head>
<body>
<div class="app">
  <header>
    <h1>🌾 小满屉</h1>
    <div class="controls">
      <div class="levelpicker" id="levelpicker">
        <button id="levelBtn" aria-haspopup="true" aria-expanded="false" aria-label="选择关卡"></button>
        <div id="levelPanel" class="levelpanel" hidden></div>
      </div>
      <div class="hint-control">
        <button id="hint" title="卡住了？让求解器给一步建议（再点一次收起）">💡 提示</button>
        <aside id="hintCoach" class="hint-coach" hidden aria-label="提示按钮引导">
          <p id="hintCoachText" role="status">不知道怎么收纳的时候，可以用提示～</p>
          <button id="hintCoachClose" type="button" aria-label="关闭提示按钮引导">知道啦</button>
        </aside>
      </div>
      <button id="restart">↺ 重开</button>
    </div>
  </header>
  <aside id="tutorial" class="tutorial" aria-label="第一关操作教学" hidden>
    <div class="tutorial-head"><span id="tutorialCount"></span><button id="tutorialSkip">跳过教学</button></div>
    <ol class="tutorial-steps"><li>拖入</li><li>旋转</li><li>调整</li><li>收齐</li></ol>
    <h2 id="tutorialTitle"></h2><p id="tutorialText" aria-live="polite"></p>
  </aside>
  <button id="tutorialShow" class="tutorial-show" hidden>查看操作教学</button>
  <div class="statusbar">
    <p id="status" role="status" aria-live="polite">物品摊在桌面上，拖进抽屉收纳。</p>
    <div class="level-summary" aria-label="收纳进度与本关目标">
      <div class="summary-item summary-progress">
        <svg class="summary-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h16M10 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><span class="summary-label">已收好</span><strong id="progress" aria-live="polite"></strong></div>
      </div>
      <div class="summary-item summary-slack">
        <svg class="summary-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
        <div><span id="slackLabel" class="summary-label">本关可留空</span><strong id="slack"></strong></div>
      </div>
    </div>
  </div>
  <section class="panel" id="stockPanel" aria-label="桌面">
    <div class="playfield" id="playfield">
      <canvas id="desk" aria-label="桌面：未收纳的物品摊在这里，可任意拖动、点按旋转"></canvas>
      <div class="frames" id="frames"></div>
    </div>
    <p id="emptyStock" hidden>桌面清空了，物品都收进抽屉啦。</p>
    <p class="stock-help">点一下任何物品 = 换方向（键盘 R 同效）；物品可在抽屉四周随手摆放，拖进抽屉时自动对齐格子。靠近能放下的空位时，会帮你挪一点、转个方向。带金色铆钉的物品被钉住，不能移动。</p>
  </section>
  <footer>
    全部物品收进抽屉即可通关，可以留空隙。物品随时能取回，钉住的物品不能移动。卡住了可点「💡 提示」。
  </footer>
</div>
<canvas id="dragLayer" aria-hidden="true"></canvas>
<div class="win" id="win" hidden>
  <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="win-confetti" id="winConfetti" aria-hidden="true"></div>
    <div class="win-medal" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="m32 8 7 15 17 2-12 12 3 18-15-8-15 8 3-18L8 25l17-2z" fill="#fff5c3" stroke="#d89b26" stroke-width="2.5" stroke-linejoin="round"/><path d="m25 32 5 5 10-11" fill="none" stroke="#b58425" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="win-kicker">收纳完成</span>
    <h2 id="winTitle">你太棒了！</h2>
    <p id="winText"></p>
    <div class="win-buttons">
      <button id="keep">再整理一下</button>
      <button id="next" class="primary">下一关 →</button>
    </div>
  </div>
</div>
<div class="intro" id="intro" hidden>
  <div class="intro-card" role="dialog" aria-modal="true" aria-labelledby="introName">
    <span class="intro-kicker" id="introKicker">新道具</span>
    <div class="intro-stage"><canvas id="introCanvas" aria-hidden="true" title="戳一下试试"></canvas></div>
    <h2 id="introName"></h2>
    <p id="introText" aria-live="polite"></p>
    <div class="intro-foot">
      <button id="introNext" class="primary" type="button"></button>
      <span class="intro-dots" id="introDots" aria-hidden="true"></span>
    </div>
    <p class="intro-tip">点任意处继续 · 戳物品它会动 · Esc 跳过</p>
  </div>
</div>
<script src="core.js?v=20261115c"></script>
<script src="solver.js"></script>
<script src="art.js"></script>
<script src="app.js?v=20261115c"></script>
</body>
</html>
